<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <header class="top-bar">
  <div class="wrap flex-head">
    <a href="/" class="brand">Переплет</a>
    <nav class="menu">
      <a href="/">Главная</a>
      <a href="catalog.html">Каталог книг</a>
      <a href="add.html">Добавить книгу</a>
      <a href="login.html">Вход</a>
      <a href="register.html" class="btn green-btn">Регистрация</a>
    </nav>
  </div>
</header>


  <main class="wrap main-box">
    <div class="auth-box">
      <h1>Вход</h1>
      <p class="sub-text">Введите логин и пароль</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginUsername">Логин или Email *</label>
          <input type="text" id="loginUsername" name="loginUsername" class="input-box" placeholder="mc_LOVIN">
          <span class="err" id="loginUsernameError"></span>
        </div>

        <div class="field">
          <label for="loginPassword">Пароль *</label>
          <div class="pass-line">
            <input type="password" id="loginPassword" name="loginPassword" class="input-box" placeholder="••••••••">
          </div>
          <span class="err" id="loginPasswordError"></span>
        </div>

        <button type="submit" class="btn green-btn full-w">Войти</button>
        <div id="loginSuccess" class="ok-msg hide">
          Авторизация выполнена
        </div>
      </form>

      <p class="switch-auth">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
    </div>
  </main>

  <footer class="bottom-bar">
    <div class="wrap">
      <p>2026 Онлайн-библиотека Переплет</p>
    </div>
  </footer>

  <script src="/scripts/script.js"></script>
</body>
</html>
